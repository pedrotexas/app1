<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Líder IA · Desafio 7 dias</title>
<meta name="description" content="App do Desafio Smart Líder IA: diagnóstico do seu tipo de líder, 7 dias com 1 microação por dia, progresso e modo equipe.">
<meta name="theme-color" content="#061233">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smart Líder">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#061233;--ink-2:#0A1E5C;--royal:#0A3CB0;--sky:#3D7BFF;--gold:#F79300;--gold-hi:#FFC53D;
  --paper:#F6F8FD;--white:#fff;--text:#14203F;--muted:#56627F;--line:rgba(20,32,63,.12);--card:#fff;
  --s-int:#3D7BFF;--s-com:#F79300;--s-rel:#16A673;--s-imp:#8B5CF6;
  --font-d:'Fraunces',Georgia,serif;--font-b:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);--r:20px;--shadow:0 10px 30px -12px rgba(6,18,51,.25);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font-b);background:var(--paper);color:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--royal)}
h1,h2,h3{font-family:var(--font-d);line-height:1.15;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:clamp(28px,7vw,40px);font-weight:800}
h2{font-size:24px;font-weight:700}
h3{font-size:19px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.logo-sl{display:inline-block;aspect-ratio:560/181;background:url(logo.webp) center/contain no-repeat}
.chip-ia{display:inline-grid;place-items:center;font:800 11px/1 var(--font-b);color:var(--ink);background:linear-gradient(135deg,var(--gold-hi),var(--gold));border-radius:6px;padding:4px 6px;letter-spacing:.04em}

/* ---------- layout ---------- */
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(88px + var(--safe-b))}
.wide #app{max-width:1080px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;background:rgba(246,248,253,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .logo-sl{height:22px}
.topbar .sp{flex:1}
.pill{cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:6px 10px;border-radius:999px;background:var(--white);border:1px solid var(--line)}
.pill.fire{color:#C2410C}
.pill.xp{color:var(--royal)}
.view{padding:18px 18px 24px;animation:in .45s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card+.card,.stack>*+*{margin-top:14px}
.dark{background:radial-gradient(120% 100% at 0% 0%,#14307f 0%,var(--ink) 55%);color:#E6ECFF;border:0}
.dark h1,.dark h2,.dark h3{color:#fff}
.dark .muted{color:#AFC0EE}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;padding:14px 20px;border-radius:14px;transition:transform .15s var(--ease),box-shadow .2s,opacity .2s;user-select:none}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:var(--ink);box-shadow:0 10px 24px -10px rgba(247,147,0,.8)}
.btn-blue{background:var(--royal);color:#fff;box-shadow:0 10px 24px -10px rgba(10,60,176,.8)}
.btn-ghost{background:var(--white);border:1px solid var(--line);color:var(--ink)}
.dark .btn-ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--royal);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- bottom nav ---------- */
.nav[hidden]{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:8px 10px calc(8px + var(--safe-b));background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav-in{display:flex;width:100%;max-width:560px;justify-content:space-around}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 8px;border-radius:12px;min-width:60px;transition:color .2s}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--royal)}
.nav button.on svg{transform:translateY(-1px)}

/* ---------- home ---------- */
.hello{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:800 24px/1 var(--font-d);color:#fff}
.ring .v small{display:block;font:600 11px/1.2 var(--font-b);color:#AFC0EE}
.level{margin-top:14px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold-hi),var(--gold));transition:width .8s var(--ease)}
.bar.light{background:#E7ECF8}
.today{position:relative;overflow:hidden}
.today .num{position:absolute;right:-6px;top:-24px;font:800 140px/1 var(--font-d);color:rgba(10,60,176,.06)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#EEF3FF;color:var(--royal)}
.tag .dot{width:8px;height:8px;border-radius:50%}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font:800 18px var(--font-d);background:#EEF2FB;color:#9AA6C3;position:relative;transition:transform .2s}
.wd.done{background:linear-gradient(135deg,var(--royal),var(--sky));color:#fff}
.wd.cur{background:#fff;color:var(--royal);box-shadow:0 0 0 2px var(--gold) inset}
.wd.done::after{content:"✓";position:absolute;right:3px;top:1px;font:800 10px var(--font-b);color:var(--gold-hi)}
.wd:active{transform:scale(.94)}

/* ---------- journey list ---------- */
.jitem{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line);text-align:left;width:100%;transition:transform .15s}
.jitem:active{transform:scale(.99)}
.jitem+.jitem{margin-top:10px}
.jnum{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font:800 22px var(--font-d);background:#EEF2FB;color:var(--royal)}
.jitem.done .jnum{background:linear-gradient(135deg,var(--royal),var(--sky));color:#fff}
.jitem.lock{opacity:.55}
.jitem .t{font-weight:700;color:var(--ink)}
.jitem .s{font-size:13px;color:var(--muted)}
.jitem .r{margin-left:auto;font-size:20px}
.section-t{margin:22px 4px 10px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- day flow ---------- */
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps i{flex:1;height:5px;border-radius:99px;background:#DCE3F3;transition:background .3s}
.steps i.on{background:var(--gold)}
.read p{margin:0 0 12px;font-size:16.5px;line-height:1.65}
.read p strong{color:var(--ink)}
.read .quote{font-family:var(--font-d);font-style:italic;font-size:20px;line-height:1.35;color:var(--royal);border-left:4px solid var(--gold);padding:4px 0 4px 14px;margin:16px 0}
.read ul{margin:0 0 12px 20px}
.read li{margin:4px 0}
.action{background:linear-gradient(135deg,#FFF6E6,#FFFBF3);border:1px solid #FBD9A0}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;width:100%;text-align:left;transition:all .2s}
.check+.check{margin-top:8px}
.check .box{width:26px;height:26px;border-radius:8px;border:2px solid #C3CCE3;flex:none;display:grid;place-items:center;transition:all .25s var(--ease)}
.check.on{border-color:var(--royal);background:#F3F6FF}
.check.on .box{background:var(--royal);border-color:var(--royal)}
.check.on .box::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.likert{margin-top:14px}
.likert .q{font-weight:600;margin-bottom:8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{padding:10px 0;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;transition:all .2s}
.scale button.on{background:var(--royal);color:#fff;border-color:var(--royal);transform:scale(1.04)}
.scale-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
textarea,input[type=text],input[type=email]{color:var(--text);width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;font-size:16px;outline:none;transition:border .2s,box-shadow .2s}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(61,123,255,.15)}
label.f{display:block;font-weight:600;margin:14px 0 6px}
.footer-actions{display:flex;gap:10px;margin-top:18px}
.footer-actions .btn{flex:1}

/* options (quiz) */
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;font-weight:500;transition:all .2s var(--ease)}
.opt+.opt{margin-top:10px}
.opt:hover{border-color:var(--sky)}
.opt.on{border-color:var(--royal);background:#F0F4FF;box-shadow:0 0 0 2px var(--royal) inset}
.opt b{color:var(--royal);margin-right:6px}
.qcount{font-weight:700;color:var(--muted);font-size:13px}

/* radar */
.radar{width:100%;max-width:320px;margin:0 auto;display:block}
.radar .shape{transition:all .9s var(--ease)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.lg{padding:10px 12px;border-radius:14px;background:#F4F7FE}
.lg .k{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.lg .k i{width:10px;height:10px;border-radius:50%}
.lg .v{font:800 22px var(--font-d);color:var(--ink)}
.dark .lg{background:rgba(255,255,255,.07)}
.dark .lg .v{color:#fff}

/* gauge */
.gauge{position:relative;height:16px;border-radius:99px;background:linear-gradient(90deg,#E5484D,#F79300 50%,#16A673);margin:16px 0 6px}
.gauge i{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--ink);transform:translate(-50%,-50%);transition:left 1s var(--ease);box-shadow:0 4px 10px rgba(0,0,0,.25)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:#F4F7FE;font-size:12px;font-weight:600;color:var(--muted)}
.badge .e{font-size:28px;display:block;filter:grayscale(1);opacity:.35}
.badge.on{background:linear-gradient(135deg,#FFF5E1,#FFFDF7);color:var(--ink);box-shadow:0 0 0 1px #FAD38E inset}
.badge.on .e{filter:none;opacity:1}

/* team */
.member{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.member:last-child{border:0}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.member .n{font-weight:700;color:var(--ink)}
.member .m{font-size:12px;color:var(--muted)}
.member .p{margin-left:auto;text-align:right;font:800 16px var(--font-d);color:var(--royal)}
.code{font:800 34px/1 var(--font-d);letter-spacing:.18em;color:var(--ink);background:#F4F7FE;border:2px dashed #C9D4F1;border-radius:16px;padding:14px;text-align:center}
.seg{display:flex;background:#E9EEF9;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(6,18,51,.12)}

/* onboarding */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px calc(28px + var(--safe-b));background:radial-gradient(120% 80% at 10% 0%,#1b3c95 0%,var(--ink) 60%);color:#E6ECFF}
.ob h1{color:#fff}
.ob .logo-wrap{display:inline-flex;align-items:center;gap:8px;background:#fff;padding:10px 14px;border-radius:14px;margin-bottom:24px;align-self:flex-start}
.ob .logo-wrap .logo-sl{height:30px}
.ob .card{color:var(--text)}
.choice{display:flex;gap:14px;align-items:center;padding:18px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#fff;width:100%;text-align:left;transition:all .2s}
.choice+.choice{margin-top:12px}
.choice .ic{font-size:30px}
.choice b{display:block;font-size:17px}
.choice span{font-size:13px;color:#AFC0EE}
.choice.on{background:rgba(247,147,0,.14);border-color:var(--gold)}
.ob input{background:rgba(255,255,255,.95)}
.ob label.f{color:#fff}
.dots{display:flex;gap:6px;justify-content:center;margin-top:18px}
.dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.25);transition:all .3s}
.dots i.on{width:22px;background:var(--gold)}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:90;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(6,18,51,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
.modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + var(--safe-b));max-height:92vh;overflow:auto;animation:up .35s var(--ease)}
@media(min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:24px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:100}

/* celebrate */
.celebrate{text-align:center;padding:28px 10px}
.celebrate .big{font-size:64px;animation:pop .7s var(--ease)}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.xpfly{font:800 28px var(--font-d);color:var(--gold);animation:pop .7s var(--ease)}

.prompt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55;background:#0B1736;color:#DCE6FF;border-radius:16px;padding:16px;max-height:300px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.belief{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:500;margin-top:8px;transition:all .2s}
.belief.on{border-color:#E5484D;background:#FFF2F2}
.belief.pick{box-shadow:0 0 0 2px var(--gold) inset;background:#FFF8EC;border-color:var(--gold)}
.cardimg{width:100%;border-radius:18px;box-shadow:var(--shadow);display:block}
.install-hint{display:flex;gap:12px;align-items:center}
.install-hint .ic{width:46px;height:46px;border-radius:12px;background:url(icons/icon-192.png) center/cover;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.mlist button{display:flex;align-items:center;gap:14px;width:100%;padding:15px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:600;color:var(--ink)}
.mlist button:last-child{border:0}
.mlist .e{width:40px;height:40px;border-radius:12px;background:#EEF3FF;display:grid;place-items:center;font-size:20px;flex:none}
.mlist .chev{margin-left:auto;color:#9AA6C3}
.coach{display:flex;gap:14px;align-items:center}
.coach .ph{width:72px;height:72px;border-radius:20px;background:url(pedro.webp) center/cover #dfe6f7;flex:none}
@media(min-width:900px){
  .wide .home-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
  .wide .home-grid>.stack{margin:0}
}

/* dentro de MemberApp/site (iframe): menu fica no topo, sempre visível */
.embed .nav{top:0;bottom:auto;padding:6px 10px;border-top:0;border-bottom:1px solid var(--line)}
.embed .nav button{flex-direction:row;gap:6px;font-size:12px;min-width:0;padding:8px 6px}
.embed .nav button svg{width:20px;height:20px}
.embed #app{padding-top:54px;padding-bottom:40px}
.embed .topbar{top:54px}
.embed .toast{bottom:auto;top:8px;transform:translate(-50%,-10px)}
.embed .toast.on{transform:translate(-50%,0)}
.embed #app{padding-bottom:140px}
/* dentro da MemberApp a barra dela cobre o rodapé: janelas abrem no topo */
.embed .modal{align-items:flex-start;padding-top:64px}
.embed .modal .sheet{border-radius:0 0 24px 24px;max-height:calc(100vh - 200px);padding-bottom:22px}
@media(max-width:420px){.embed .nav button{flex-direction:column;gap:2px;font-size:10.5px}.embed #app{padding-top:62px}.embed .topbar{top:62px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav" hidden><div class="nav-in">
  <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-go="journey"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h4V9H4zM10 19h4V5h-4zM16 19h4v-7h-4z"/></svg>Desafio</button>
  <button data-go="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 21 12 12 22 3 12z"/><path d="M12 7l4.5 5L12 17l-4.5-5z"/></svg>Meu perfil</button>
  <button data-go="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Compartilhar</button>
  <button data-go="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Mais</button>
</div></nav>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
